name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [seller-dashboard, admin-dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test --if-present --workspace apps/${{ matrix.app }}

  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [seller-dashboard, admin-dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/${{ matrix.app }}
      - name: E2E tests
        run: npm run test:e2e --if-present --workspace apps/${{ matrix.app }}
