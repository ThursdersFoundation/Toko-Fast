name: Feature request
description: Suggest an improvement or new capability.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what is in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - seller-dashboard
        - admin-dashboard
        - both
        - infrastructure / CI
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
