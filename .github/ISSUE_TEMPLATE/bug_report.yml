name: Bug report
description: Report something broken in Toko-Fast.
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: input
    id: area
    attributes:
      label: Affected area
      description: Which app/feature is affected? e.g. seller-dashboard/orders
      placeholder: seller-dashboard/orders
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low — cosmetic
        - Medium — broken feature, workaround exists
        - High — broken feature, no workaround
        - Critical — data loss / security
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Console output, stack traces, screenshots.
